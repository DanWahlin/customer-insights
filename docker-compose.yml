services:
  postgresDb:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-web}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-web-password}
      POSTGRES_DB: ${POSTGRES_DATABASE:-CustomersDB}
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

# Alternatively, run the container directly:
# docker run --name postgresDb -e POSTGRES_USER=web -e POSTGRES_PASSWORD=web-password -e POSTGRES_DB=CustomersDB -v postgres-data-v18:/var/lib/postgresql -p 127.0.0.1:5432:5432 postgres:18-alpine

volumes:
  postgres-data-v18:

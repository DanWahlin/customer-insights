@if (this.data) {
  <section class="related-section">
    <h2>Email</h2>
    <div class="scroller content-list">
      @for (email of this.data; track email.id ?? $index) {
        <mat-card appearance="outlined" class="content-item">
          <mat-card-header>
            <mat-card-title>{{ email.subject }}</mat-card-title>
            <mat-card-subtitle>{{ email.bodyPreview }}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-actions>
            <a mat-stroked-button [href]="email.webLink" target="_blank" rel="noopener">View Email Message</a>
          </mat-card-actions>
        </mat-card>
      }
    </div>
    @if (!this.data.length) {
      <div class="content-empty"><h3>No related email</h3><p>Try another customer name or search term.</p></div>
    }
  </section>
}

@if (this.data) {
  <section class="related-section">
    <h2>Files</h2>
    <div class="scroller content-list">
      @for (file of this.data; track file.id) {
        <mat-card appearance="outlined" class="content-item">
          <mat-card-header>
            <mat-card-title>{{ file.name }}</mat-card-title>
            @if (file.lastModifiedDateTime) {
              <mat-card-subtitle>Modified {{ file.lastModifiedDateTime | date:'medium' }}</mat-card-subtitle>
            }
          </mat-card-header>
          <mat-card-actions>
            <a mat-stroked-button [href]="file.webUrl" target="_blank" rel="noopener">View File</a>
          </mat-card-actions>
        </mat-card>
      }
    </div>
    @if (!this.data.length) {
      <div class="content-empty"><h3>No related files</h3><p>Try another customer name or search term.</p></div>
    }
  </section>
}

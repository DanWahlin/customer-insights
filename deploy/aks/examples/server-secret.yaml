# Example only. Do not point the Deployment at this Secret.
# Create the real "server-secrets" Secret with kubectl after infrastructure
# provisioning, then leave this file unchanged as a template/reference.
apiVersion: v1
kind: Secret
metadata:
  name: server-secrets-example
  namespace: customer-insights
type: Opaque
stringData:
  POSTGRES_USER: "<postgres-admin-username>"
  POSTGRES_PASSWORD: "<postgres-admin-password>"
  POSTGRES_HOST: "<postgres-hostname>"
  POSTGRES_DATABASE: "CustomersDB"
  POSTGRES_PORT: "5432"
  ENTRAID_TENANT_ID: "<tenant-id>"
  ENTRAID_API_CLIENT_ID: "<api-app-client-id>"
  ENTRAID_CLIENT_ID: "<spa-client-id>"
  ENTRAID_API_SCOPE: "<api-scope>"
  AI_ENDPOINT: "<optional-model-endpoint>"
  AI_API_KEY: "<optional-model-api-key>"
  AI_MODEL: "gpt-5-mini"
  AI_EMBEDDING_MODEL: "text-embedding-3-small"
  AZURE_AI_SEARCH_ENDPOINT: "<optional-search-endpoint>"
  AZURE_AI_SEARCH_KEY: "<optional-search-key>"
  AZURE_AI_SEARCH_INDEX: "customer-documents-index"
  AZURE_AI_SEARCH_KNOWLEDGE_SOURCE: "customer-documents-ks"
  AZURE_AI_SEARCH_KNOWLEDGE_BASE: "customer-documents-kb"
  DOCUMENT_REPOSITORY_URL: "https://github.com/DanWahlin/customer-insights/blob/main/"
  ACS_CONNECTION_STRING: "<optional-acs-connection-string>"
  ACS_PHONE_NUMBER: "<optional-acs-phone-number>"
  ACS_EMAIL_ADDRESS: "<optional-acs-email-address>"
  CUSTOMER_EMAIL_ADDRESS: "<optional-approved-test-email>"
  CUSTOMER_PHONE_NUMBER: "<optional-approved-test-phone>"

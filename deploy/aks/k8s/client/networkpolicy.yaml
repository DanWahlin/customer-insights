apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-allow-ingress
  namespace: customer-insights
  labels:
    app: client
spec:
  podSelector:
    matchLabels:
      app: client
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-routing-system
